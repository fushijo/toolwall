[workspace]
resolver = "2"
members = [
    "crates/toolwall-core",
    "crates/toolwall-cli",
    "crates/toolwall-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/OWNER/toolwall"

[workspace.dependencies]
toolwall-core = { path = "crates/toolwall-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
directories = "5"
